<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="title">
        <h1>Rock Paper Scissors</h1>
    </div>

    <div class="game">

        <div class="text">
            <h2 id="round_result">Choose your weapon</h2>

        </div>

        <div id="results">
            <div class="choice"><span class="emoji" id="human_choice_display">❓</span>  
            <p>You: <span id="humanScore">0</span></p>
            </div>
            <div class="choice"><span class="emoji" id="computer_choice_display">❓</span>
            <p>Computer: <span id="computerScore">0</span></p>    
            </div>    
        </div>

    

        <div id="buttonsChoice">
            <button id="rock" value="✊">✊</button>
            <button id="paper" value="✋">✋</button>
            <button id="scissors" value="✌️">✌️</button>
        </div>   
        
        <h3>First to score 5 points wins the game</h3>

    </div>



<script src="./script.js"></script>    
</body>
</html>
